<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين كلمة سر جديدة — Inrace Store</title>
<meta name="description" content="عيّني كلمة سر جديدة لحسابك في Inrace Store.">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="hero" style="padding:70px 0;text-align:center">
  <div class="wrap" style="max-width:420px;margin:0 auto">
    <div class="eyebrow" style="margin:0 auto 18px"><span class="eyebrow-dot"></span> Inrace</div>
    <h1 style="font-size:clamp(1.7rem,3.2vw,2.2rem)">تعيين كلمة سر جديدة</h1>
    <p class="hero-sub" style="margin:0 auto 32px" id="rp-subhead">اكتب كلمة السر الجديدة بتاعك.</p>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;text-align:right" id="rp-form-box">
      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:8px">كلمة السر الجديدة</label>
      <input id="rp-password" type="password" placeholder="••••••••"
        style="width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);font-family:'Tajawal',sans-serif;font-size:14.5px;margin-bottom:6px;outline:none;direction:ltr;text-align:left">
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px">8 حروف على الأقل، وتحتوي على حرف ورقم.</p>

      <label style="display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:8px">تأكيد كلمة السر</label>
      <input id="rp-confirm" type="password" placeholder="••••••••"
        style="width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);font-family:'Tajawal',sans-serif;font-size:14.5px;margin-bottom:18px;outline:none;direction:ltr;text-align:left">

      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="submitResetPassword()">تعيين كلمة السر</button>
      <p id="rp-error" style="margin-top:14px;font-size:13.5px;color:#d94848;display:none"></p>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;display:none" id="rp-success-box">
      <div style="font-size:40px;margin-bottom:12px">✅</div>
      <h2 style="margin-bottom:10px">اتغيّرت كلمة السر</h2>
      <p style="color:var(--text-muted);margin-bottom:22px">دلوقتي تقدري تسجّل دخول بكلمة السر الجديدة.</p>
      <a href="inrace-login.html" class="btn btn-primary" style="text-decoration:none">تسجيل الدخول ←</a>
    </div>
  </div>
</section>

<script src="script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const rpEmail = params.get('email');
  const rpToken = params.get('token');

  if(!rpEmail || !rpToken){
    document.getElementById('rp-subhead').textContent = 'الرابط ده غير صالح.';
    document.getElementById('rp-form-box').style.display = 'none';
  }

  function showResetError(msg){
    const errorEl = document.getElementById('rp-error');
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  async function submitResetPassword(){
    const password = document.getElementById('rp-password').value;
    const confirm = document.getElementById('rp-confirm').value;

    if(password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)){
      showResetError('كلمة السر لازم تكون 8 حروف على الأقل، وتحتوي على حرف ورقم.');
      return;
    }
    if(password !== confirm){
      showResetError('كلمة السر وتأكيدها مش متطابقين.');
      return;
    }

    try{
      const res = await fetch(`${WORKER_API}/reset-password`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: rpEmail, token: rpToken, newPassword: password})
      });
      const data = await res.json();
      if(!res.ok){
        showResetError(data.error || 'حصل خطأ، جرب تاني.');
        return;
      }
      document.getElementById('rp-form-box').style.display = 'none';
      document.getElementById('rp-success-box').style.display = 'block';
    }catch(e){
      showResetError('حصل خطأ في الاتصال بالسيرفر.');
    }
  }
</script>
</body>
</html>
